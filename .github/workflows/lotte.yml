name: lotte-check

on:
  workflow_dispatch:
  schedule:
    - cron: "8,38 * * * *"

permissions:
  contents: write

concurrency:
  group: lotte-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOTTE_CINEMA_ID: "1|0002|3018"
          KEYWORDS: "치이카와"
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python lotte.py
          else
            end=$(( $(date +%s) + 2100 ))
            while [ $(date +%s) -lt $end ]; do
              python lotte.py || true
              sleep 60
            done
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add lotte_state.json || true
          git diff --cached --quiet || (git commit -m "update lotte state" && git pull --rebase && git push)
