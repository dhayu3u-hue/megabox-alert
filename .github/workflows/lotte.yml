name: lotte-check

on:
  workflow_dispatch:
  schedule:
    - cron: "5-59/10 * * * *"

permissions:
  contents: write

concurrency:
  group: lotte-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOTTE_CINEMA_ID: "1|0002|3018"
          KEYWORDS: "치이카와"
          EVENT_NAME: ${{ github.event_name }}
        run: python lotte.py
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add lotte_state.json || true
          git diff --cached --quiet || (git commit -m "update lotte state" && git pull --rebase && git push)
