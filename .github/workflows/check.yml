name: megabox-check

on:
  workflow_dispatch:
  schedule:
    # 한국시간 수요일 하루종일 (UTC 화 15시~수 14시)
    - cron: "*/15 15-23 * * 2"
    - cron: "*/15 0-14 * * 3"
    # 한국시간 토요일 하루종일 (UTC 금 15시~토 14시)
    - cron: "*/15 15-23 * * 5"
    - cron: "*/15 0-14 * * 6"

permissions:
  contents: write

concurrency:
  group: megabox-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRCH_NO: ${{ secrets.BRCH_NO }}
          KEYWORDS: "치이카와"
          DAYS_AHEAD: "21"
          EVENT_NAME: ${{ github.event_name }}
        run: python check.py
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
